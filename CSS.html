<style>
:root{
  --sidebar:#0C1017;--sidebar-hover:#151B24;--sidebar-active:#1A2130;--sidebar-line:#1E2531;
  --bg:#F2F1ED;--surface:#FFFFFF;--ink:#1A1712;--ink-secondary:#48443D;--muted:#8A8479;
  --line:#E2DED6;--line-light:#EEECE6;--accent:#B4862B;--accent-dark:#8C6720;--accent-tint:#F6ECD6;--accent-tint2:#FDF8EE;
  --danger:#C4291C;--danger-tint:#FBEAE9;--success:#2E7D46;--success-tint:#E5F5EA;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;transition:background .3s,color .3s;}

html.dark{
  --bg:#0C1017;--surface:#151B24;--ink:#E8E0D0;--ink-secondary:#A8A297;--muted:#6B6560;
  --line:#2A2F38;--line-light:#1E2531;--accent:#C6952F;--accent-dark:#E8B84A;--accent-tint:#2A2518;--accent-tint2:#1A1710;
  --danger:#EF5350;--danger-tint:#2A1515;--success:#4CAF50;--success-tint:#152A18;
}
html.dark .login-wrap{background:linear-gradient(145deg,#050810 0%,#0C1017 50%,#151B24 100%);}
html.dark .login-card{background:var(--surface);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);}
html.dark .field input{background:#0C1017;border-color:var(--line);color:var(--ink);}
html.dark .field input:focus{background:#0A0E14;border-color:var(--accent);}
html.dark .topbar{background:var(--surface);border-color:var(--line);}
html.dark .content{background:var(--bg);}
html.dark .sidebar{border-color:var(--line);}
html.dark .dt-table-wrap{background:var(--surface);border-color:var(--line);}
html.dark table.dt tbody td{border-color:var(--line-light);color:var(--ink);}
html.dark table.dt tbody td.sno-cell{background:#0A0E14;border-right-color:var(--line);}
html.dark table.dt tbody tr:nth-child(even){background:#0F141B;}
html.dark table.dt tbody tr:nth-child(even) td.sno-cell{background:#080C12;}
html.dark table.dt tbody tr:hover{background:var(--accent-tint);}
html.dark table.dt tbody tr:hover td.sno-cell{background:#1A1710;}
html.dark .dt-pagination{background:var(--surface);border-color:var(--line);color:var(--ink-secondary);}
html.dark .dt-pagination select{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark .dt-pagination .nav button{background:#1A1F28;border-color:#2A2F38;color:var(--ink-secondary);}
html.dark .btn-ghost{border-color:var(--line);color:var(--ink-secondary);}
html.dark .btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
html.dark .topbar-controls{background:var(--surface);border-color:var(--line);}
html.dark .topbar-controls button{color:var(--ink-secondary);}
html.dark .entry-toolbar{background:var(--surface);border-color:var(--line);}
html.dark .entry-panel{background:var(--surface);border-color:var(--line);}
html.dark .entry-scroll{background:var(--surface);}
html.dark .panel-head{background:#0F141B;border-color:#2A2F38;color:var(--ink-secondary);}
html.dark .panel-foot{border-color:#2A2F38;}
html.dark table.entry input{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark table.entry input:focus{background:#0F141B;border-color:var(--accent);}
html.dark table.entry thead th{background:#080C12;}
html.dark table.entry tbody td{border-color:#2A2F38;}
html.dark table.entry tbody tr:nth-child(even){background:#0F141B;}
html.dark table.entry tbody tr:hover{background:#1A2130;}
html.dark .mat-top-field input{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark .mat-top-field input:focus{background:#0F141B;border-color:var(--accent);}
html.dark .mat-card{background:var(--surface);border-color:var(--line);}
html.dark .mat-card-head{background:#0F141B;border-color:#2A2F38;}
html.dark .mat-card select{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark .dropzone{background:#0F141B;border-color:#2A2F38;}


#app{height:100vh;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
input,select,button{font-family:inherit;font-size:13px;}
::selection{background:var(--accent-tint);}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CCC8BE;border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

.loading-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);background:var(--bg);}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0C1017 0%,#151B24 50%,#1A2130 100%);padding:20px;}
.login-card{width:400px;background:var(--surface);border-radius:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;}
.login-top{background:linear-gradient(135deg,#0C1017,#1A2130);color:#EDE6D6;padding:32px 34px 26px;border-bottom:3px solid var(--accent);}
.login-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;}
.login-top h1{font-size:22px;margin:8px 0 0;font-weight:600;letter-spacing:-.01em;color:#fff;}
.login-body{padding:30px 34px 34px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:#FAFAF7;color:var(--ink);transition:border .15s,box-shadow .15s;}
.field input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-tint);}
.btn{border:none;border-radius:4px;padding:11px 18px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;}
.btn:active{transform:scale(.98);}
.btn-gold{background:linear-gradient(135deg,#C69530,#A07520);color:#fff;box-shadow:0 2px 8px rgba(180,134,43,.3);}
.btn-gold:hover{box-shadow:0 4px 14px rgba(180,134,43,.4);filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:4px;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.btn-block{width:100%;justify-content:center;}
.login-error{background:var(--danger-tint);color:var(--danger);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:500;}


.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:54px;flex:none;background:var(--sidebar);color:#A8A297;display:flex;flex-direction:column;height:100vh;border-right:1px solid var(--sidebar-line);transition:width .25s ease;}
.sidebar .brand{padding:10px 8px;border-bottom:1px solid var(--sidebar-line);display:flex;align-items:center;justify-content:center;}
.sidebar .brand-icon{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#C6952F);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:13px;}
.sidebar .nav{flex:1;padding:8px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.sidebar .nav-icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:6px;cursor:pointer;transition:background .12s;color:#8E887D;position:relative;}
.sidebar .nav-icon:hover{background:var(--sidebar-hover);color:#E8E0D0;}
.sidebar .nav-icon.active{background:var(--sidebar-active);color:#F0EAD8;}
.sidebar .nav-icon.active::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0;}
.sidebar .nav-icon svg{width:18px;height:18px;}
.sidebar .nav-tooltip{display:none;position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:8px;background:#1A2130;color:#F0EAD8;padding:5px 10px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:50;font-weight:500;}
.sidebar .nav-icon:hover .nav-tooltip{display:block;}
.sidebar-foot{padding:10px 6px 14px;border-top:1px solid var(--sidebar-line);display:flex;justify-content:center;}
.logout-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;color:#8E887D;transition:all .12s;}
.logout-btn:hover{background:var(--sidebar-hover);color:#E8E0D0;}

.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;height:42px;display:flex;align-items:center;justify-content:space-between;flex:none;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-left .breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.topbar-left .breadcrumb a{color:var(--accent-dark);text-decoration:none;cursor:pointer;font-weight:500;}
.topbar-left .breadcrumb a:hover{text-decoration:underline;}
.topbar-left .breadcrumb .sep{color:var(--line);}
.topbar-left .breadcrumb .current{color:var(--ink);font-weight:600;}
.topbar-left h2{font-size:13px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-controls{display:flex;align-items:center;gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:2px 4px;}
.topbar-controls button{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:3px;font-size:12px;color:var(--ink-secondary);font-weight:700;transition:all .12s;line-height:1;}
.topbar-controls button:hover{background:var(--accent-tint);color:var(--accent-dark);}
.topbar-controls .divider{width:1px;height:14px;background:var(--line);margin:0 2px;}
.topbar-clock{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-secondary);background:var(--bg);padding:4px 8px;border-radius:4px;font-weight:500;}
.topbar-welcome{font-size:11px;color:var(--ink-secondary);font-weight:500;}
.topbar-welcome b{color:var(--ink);font-weight:600;}
.avatar{width:28px;height:28px;border-radius:4px;background:linear-gradient(135deg,var(--accent),#C6952F);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:11px;flex:none;}
.content{padding:2px 8px 2px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}


.toast{position:fixed;top:16px;right:16px;z-index:100;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;animation:toast-in .22s cubic-bezier(.2,.8,.4,1);background:var(--success-tint);color:var(--success);border:1px solid #BEE3C9;}
@keyframes toast-in{from{opacity:0;transform:translateY(-10px) scale(.96);}to{opacity:1;transform:none;}}
.toast.err{background:var(--danger-tint);color:var(--danger);border-color:#F3C6C3;}

.dt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex:none;flex-wrap:wrap;}
.dt-toolbar .count{font-size:12px;color:var(--muted);font-weight:500;font-family:'JetBrains Mono',monospace;}
.dt-colmenu-wrap{position:relative;margin-left:auto;}
.dt-colmenu{position:absolute;right:0;top:38px;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:12px;min-width:220px;max-height:360px;overflow-y:auto;z-index:20;}
.dt-colmenu .h{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:700;margin-bottom:8px;}
.dt-colmenu label{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 4px;cursor:pointer;border-radius:4px;}
.dt-colmenu label:hover{background:var(--accent-tint2);}
.dt-table-wrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.dt-scroll{flex:1;overflow:auto;min-height:0;}
table.dt{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;}
table.dt thead th{position:sticky;top:0;background:#0F141B;color:#D6CFC0;z-index:4;padding:0;border-right:1px solid #1E2531;overflow:visible;}
table.dt thead th .th-inner{padding:9px 12px;display:flex;flex-direction:column;gap:4px;position:relative;min-height:36px;}
table.dt thead th .th-row{display:flex;align-items:center;gap:6px;}
table.dt thead th .th-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;line-height:1.3;}
table.dt thead th .th-label.no-sort{cursor:default;}
table.dt thead th .sort-ic{font-size:9px;color:var(--accent);width:10px;flex:none;}
table.dt thead th .search-ic{margin-left:auto;cursor:pointer;color:#6B7280;flex:none;font-size:11px;transition:color .15s;}
table.dt thead th .search-ic:hover{color:var(--accent);}
table.dt thead th .search-ic.active{color:var(--accent);}
table.dt thead th .th-filter{margin-top:3px;}
table.dt thead th .th-filter input{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #2D3545;background:#0A0E14;color:#E8E0D0;font-size:11.5px;}
table.dt thead th .th-filter input::placeholder{color:#5A6070;}
table.dt thead th .resize-handle{position:absolute;right:-4px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:5;}
table.dt thead th .resize-handle:hover,table.dt thead th .resize-handle.active{background:rgba(180,134,43,.4);}
table.dt thead th.sno-col{background:#080C12;padding:0;}
table.dt thead th.sno-col .th-inner{padding:6px 4px;min-height:auto;}
table.dt thead th.sno-col .th-label{cursor:default;color:#8A8479;font-size:9px;}
table.dt thead th.filtered{background:#2A1F10 !important;}
table.dt tbody td{padding:8px 12px;border-bottom:1px solid var(--line-light);border-right:1px solid #F2F0EA;font-size:12.5px;white-space:normal;word-break:break-word;vertical-align:middle;overflow-wrap:anywhere;}
table.dt tbody td.sno-cell{text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;background:#FAFAF7;border-right:1.5px solid var(--line);vertical-align:middle;padding:6px 4px;width:38px;}
table.dt tbody tr:nth-child(even){background:#FAFAF7;}
table.dt tbody tr:nth-child(even) td.sno-cell{background:#F2F0EA;}
table.dt tbody tr:hover{background:var(--accent-tint2);}
table.dt tbody tr:hover td.sno-cell{background:var(--accent-tint);}
.code-pill{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:var(--accent-dark);background:var(--accent-tint);border-radius:5px;padding:3px 8px;display:inline-block;}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink-secondary);margin-bottom:6px;font-weight:600;}
.dt-pagination{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:4px 12px;font-size:12px;color:var(--muted);font-weight:500;}
.dt-pagination .pp{display:flex;align-items:center;gap:8px;}
.dt-pagination select{padding:5px 10px;border:1.5px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-weight:600;}
.dt-pagination .range-info{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-secondary);font-weight:600;}
.dt-pagination .nav{display:flex;align-items:center;gap:4px;margin-left:auto;}
.dt-pagination .nav button{border:1.5px solid var(--line);background:#fff;border-radius:4px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--ink-secondary);font-size:12px;transition:all .12s;}
.dt-pagination .nav button:disabled{opacity:.35;cursor:default;}
.dt-pagination .nav button:not(:disabled):hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.dt-pagination .pageinfo{font-weight:600;color:var(--ink-secondary);white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:11.5px;}


.entry-toolbar{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 12px;display:flex;align-items:center;gap:12px;margin-bottom:4px;flex:none;}
.entry-panels{display:flex;gap:8px;flex:1;min-height:0;overflow:hidden;flex-direction:column;}
.entry-panel{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;}
.panel-head{padding:3px 10px;font-size:10px;font-weight:700;color:var(--ink-secondary);border-bottom:1px solid var(--line-light);background:var(--accent-tint2);display:flex;align-items:center;gap:6px;flex:none;}
.panel-count{font-weight:500;color:var(--muted);font-size:9.5px;}
.panel-foot{padding:4px 8px;border-top:1px solid var(--line-light);flex:none;display:flex;align-items:center;gap:8px;}
.entry-scroll{flex:1;min-height:0;overflow:auto;}
table.entry{border-collapse:separate;border-spacing:0;}
table.entry thead th{background:#0F141B;color:#D6CFC0;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:11px 10px;text-align:left;white-space:nowrap;font-weight:600;position:sticky;top:0;z-index:2;position:relative;}
table.entry thead th .eresize{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3;}
table.entry thead th .eresize:hover{background:rgba(180,134,43,.5);}
table.entry tbody td{padding:4px 5px;border-bottom:1px solid var(--line-light);vertical-align:middle;}
table.entry tbody tr:nth-child(even){background:#FAFAF7;}
table.entry tbody tr:hover{background:var(--accent-tint2);}
table.entry .rownum{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);text-align:center;width:28px;}
table.entry input{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);transition:border .15s;}
table.entry input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint);}
table.entry input.num{font-family:'JetBrains Mono',monospace;text-align:right;}
table.entry input.cell-ro{background:#F5F4F0;color:var(--muted);border-color:#ECEAE4;cursor:not-allowed;}
html.dark table.entry input.cell-ro{background:#0F141B;color:var(--muted);border-color:#2A2F38;}
.trash-btn{border:none;background:transparent;color:var(--danger);cursor:pointer;padding:6px;border-radius:6px;line-height:1;display:inline-flex;align-items:center;justify-content:center;opacity:.6;transition:all .15s;}
.trash-btn:hover{background:var(--danger-tint);opacity:1;}


/* Material Rec Add - Card-style sections */
.mat-add-container{flex:1;min-height:0;overflow-y:auto;padding:8px 0;}
.mat-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.mat-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;}
.mat-card.full-width{grid-column:1/-1;}
.mat-card-head{padding:8px 14px;font-size:11px;font-weight:700;color:var(--ink-secondary);border-bottom:1px solid var(--line-light);background:var(--accent-tint2);display:flex;align-items:center;gap:8px;letter-spacing:.02em;}
.mat-card-head .card-icon{font-size:14px;}
.mat-card-body{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;}
.mat-top-field{display:flex;flex-direction:column;gap:4px;min-width:140px;max-width:240px;flex:1;}
.mat-top-field label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.mat-top-field input,.mat-top-field select{padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:12px;transition:border .15s;}
.mat-top-field input:focus,.mat-top-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint);}
.mat-top-field .cell-ro{background:#F5F4F0;color:var(--muted);border-color:#ECEAE4;cursor:not-allowed;}

/* Drag & drop upload zone */
.dropzone{border:2px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s;background:#FAFAF7;min-width:140px;flex:1;max-width:240px;}
.dropzone:hover,.dropzone.dragover{border-color:var(--accent);background:var(--accent-tint2);}
.dropzone .dz-icon{font-size:20px;color:var(--muted);margin-bottom:4px;}
.dropzone .dz-text{font-size:10px;color:var(--muted);font-weight:500;}
.dropzone .dz-file{font-size:10px;color:var(--accent-dark);font-weight:600;margin-top:4px;word-break:break-all;}

.saving-overlay{position:fixed;inset:0;background:rgba(12,16,23,.35);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(1px);}
