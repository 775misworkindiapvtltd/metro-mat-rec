<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base target="_top">
<title>Material Receiving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<style>
:root{
  --sidebar:#0C1017;--sidebar-hover:#151B24;--sidebar-active:#1A2130;--sidebar-line:#1E2531;
  --bg:#F2F1ED;--surface:#FFFFFF;--ink:#1A1712;--ink-secondary:#48443D;--muted:#8A8479;
  --line:#E2DED6;--line-light:#EEECE6;--accent:#B4862B;--accent-dark:#8C6720;
  --accent-tint:#F6ECD6;--accent-tint2:#FDF8EE;
  --danger:#C4291C;--danger-tint:#FBEAE9;--success:#2E7D46;--success-tint:#E5F5EA;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:13px;transition:background .3s,color .3s;}


html.dark{
  --bg:#0C1017;--surface:#151B24;--ink:#E8E0D0;--ink-secondary:#A8A297;--muted:#6B6560;
  --line:#2A2F38;--line-light:#1E2531;--accent:#C6952F;--accent-dark:#E8B84A;
  --accent-tint:#2A2518;--accent-tint2:#1A1710;
  --danger:#EF5350;--danger-tint:#2A1515;--success:#4CAF50;--success-tint:#152A18;
}
html.dark .login-wrap{background:linear-gradient(145deg,#050810 0%,#0C1017 50%,#151B24 100%);}
html.dark .login-card{background:var(--surface);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);}
html.dark .field input{background:#0C1017;border-color:var(--line);color:var(--ink);}
html.dark .field input:focus{background:#0A0E14;border-color:var(--accent);}
html.dark .topbar{background:var(--surface);border-color:var(--line);}
html.dark .content{background:var(--bg);}
html.dark .sidebar{border-color:var(--line);}
html.dark .dt-table-wrap{background:var(--surface);border-color:var(--line);}
html.dark table.dt tbody td{border-color:var(--line-light);color:var(--ink);}
html.dark table.dt tbody td.sno-cell{background:#0A0E14;border-right-color:var(--line);}
html.dark table.dt tbody tr:nth-child(even){background:#0F141B;}
html.dark table.dt tbody tr:nth-child(even) td.sno-cell{background:#080C12;}
html.dark table.dt tbody tr:hover{background:var(--accent-tint);}
html.dark table.dt tbody tr:hover td.sno-cell{background:#1A1710;}
html.dark .dt-pagination{background:var(--surface);border-color:var(--line);color:var(--ink-secondary);}
html.dark .dt-pagination select{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark .dt-pagination .nav button{background:#1A1F28;border-color:#2A2F38;color:var(--ink-secondary);}
html.dark .btn-ghost{border-color:var(--line);color:var(--ink-secondary);}
html.dark .btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);}
html.dark .topbar-controls{background:var(--surface);border-color:var(--line);}
html.dark .topbar-controls button{color:var(--ink-secondary);}
html.dark .entry-toolbar{background:var(--surface);border-color:var(--line);}
html.dark .entry-panel{background:var(--surface);border-color:var(--line);}
html.dark .entry-scroll{background:var(--surface);}
html.dark .panel-head{background:#0F141B;border-color:#2A2F38;color:var(--ink-secondary);}
html.dark .panel-foot{border-color:#2A2F38;}
html.dark table.entry input{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark table.entry input:focus{background:#0F141B;border-color:var(--accent);}
html.dark table.entry thead th{background:#080C12;}
html.dark table.entry tbody td{border-color:#2A2F38;}
html.dark table.entry tbody tr:nth-child(even){background:#0F141B;}
html.dark table.entry tbody tr:hover{background:#1A2130;}
html.dark .mat-top-field input{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark .mat-top-field input:focus{background:#0F141B;border-color:var(--accent);}
html.dark .mat-card{background:var(--surface);border-color:var(--line);}
html.dark .mat-card-head{background:#0F141B;border-color:#2A2F38;}
html.dark .mat-card select{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark .dropzone{background:#0F141B;border-color:#2A2F38;}


#app{height:100vh;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
input,select,button{font-family:inherit;font-size:13px;}
::selection{background:var(--accent-tint);}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CCC8BE;border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

.loading-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);background:var(--bg);}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0C1017 0%,#151B24 50%,#1A2130 100%);padding:20px;}
.login-card{width:400px;background:var(--surface);border-radius:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;}
.login-top{background:linear-gradient(135deg,#0C1017,#1A2130);color:#EDE6D6;padding:32px 34px 26px;border-bottom:3px solid var(--accent);}
.login-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;}
.login-top h1{font-size:22px;margin:8px 0 0;font-weight:600;letter-spacing:-.01em;color:#fff;}
.login-body{padding:30px 34px 34px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:#FAFAF7;color:var(--ink);transition:border .15s,box-shadow .15s;}
.field input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-tint);}
.btn{border:none;border-radius:4px;padding:11px 18px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;}
.btn:active{transform:scale(.98);}
.btn-gold{background:linear-gradient(135deg,#C69530,#A07520);color:#fff;box-shadow:0 2px 8px rgba(180,134,43,.3);}
.btn-gold:hover{box-shadow:0 4px 14px rgba(180,134,43,.4);filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:4px;}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.btn-block{width:100%;justify-content:center;}
.login-error{background:var(--danger-tint);color:var(--danger);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:500;}


.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:54px;flex:none;background:var(--sidebar);color:#A8A297;display:flex;flex-direction:column;height:100vh;border-right:1px solid var(--sidebar-line);transition:width .25s ease;}
.sidebar.expanded{width:160px;}
.sidebar .brand{padding:10px 8px;border-bottom:1px solid var(--sidebar-line);display:flex;align-items:center;justify-content:center;}
.sidebar .brand-icon{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#C6952F);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:13px;}
.sidebar .nav{flex:1;padding:8px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.sidebar .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:6px;cursor:pointer;transition:background .12s;color:#8E887D;position:relative;white-space:nowrap;overflow:hidden;}
.sidebar .nav-item:hover{background:var(--sidebar-hover);color:#E8E0D0;}
.sidebar .nav-item.active{background:var(--sidebar-active);color:#F0EAD8;}
.sidebar .nav-item.active::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0;}
.sidebar .nav-item svg{width:18px;height:18px;flex:none;}
.sidebar .nav-item .nav-label{font-size:8px;font-weight:600;opacity:1;text-align:center;line-height:1.1;color:inherit;letter-spacing:.02em;}
.sidebar.expanded .nav-item{flex-direction:row;gap:10px;padding:9px 10px;}
.sidebar.expanded .nav-item .nav-label{font-size:12px;font-weight:500;text-align:left;}
.sidebar .nav-item .nav-label .full{display:none;}
.sidebar .nav-item .nav-label .short{display:inline;}
.sidebar.expanded .nav-item .nav-label .full{display:inline;}
.sidebar.expanded .nav-item .nav-label .short{display:none;}
.sidebar-foot{padding:8px 6px 8px;border-top:1px solid var(--sidebar-line);display:flex;justify-content:center;flex:none;}
.logout-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;color:#8E887D;transition:all .12s;}
.logout-btn:hover{background:var(--sidebar-hover);color:#E8E0D0;}

.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding-bottom:2px;}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;height:42px;display:flex;align-items:center;justify-content:space-between;flex:none;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-left .breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.topbar-left .breadcrumb a{color:var(--accent-dark);text-decoration:none;cursor:pointer;font-weight:500;}
.topbar-left .breadcrumb a:hover{text-decoration:underline;}
.topbar-left .breadcrumb .sep{color:var(--line);}
.topbar-left .breadcrumb .current{color:var(--ink);font-weight:600;}
.topbar-left h2{font-size:13px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-controls{display:flex;align-items:center;gap:4px;background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:2px 4px;}
.topbar-controls button{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:3px;font-size:12px;color:var(--ink-secondary);font-weight:700;transition:all .12s;line-height:1;}
.topbar-controls button:hover{background:var(--accent-tint);color:var(--accent-dark);}
.topbar-controls .divider{width:1px;height:14px;background:var(--line);margin:0 2px;}
.topbar-clock{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-secondary);background:var(--bg);padding:4px 8px;border-radius:4px;font-weight:500;}
.topbar-welcome{font-size:11px;color:var(--ink-secondary);font-weight:500;}
.topbar-welcome b{color:var(--ink);font-weight:600;}
.avatar{width:28px;height:28px;border-radius:4px;background:linear-gradient(135deg,var(--accent),#C6952F);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:11px;flex:none;}
.content{padding:4px 8px 6px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}


.toast{position:fixed;top:16px;right:16px;z-index:100;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;animation:toast-in .22s cubic-bezier(.2,.8,.4,1);background:var(--success-tint);color:var(--success);border:1px solid #BEE3C9;}
@keyframes toast-in{from{opacity:0;transform:translateY(-10px) scale(.96);}to{opacity:1;transform:none;}}
.toast.err{background:var(--danger-tint);color:var(--danger);border-color:#F3C6C3;}

.dt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex:none;flex-wrap:wrap;}
.dt-toolbar .count{font-size:12px;color:var(--muted);font-weight:500;font-family:'JetBrains Mono',monospace;}
.dt-colmenu-wrap{position:relative;margin-left:auto;}
.dt-colmenu{position:absolute;right:0;top:38px;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:12px;min-width:220px;max-height:360px;overflow-y:auto;z-index:20;}
.dt-colmenu .h{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:700;margin-bottom:8px;}
.dt-colmenu label{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 4px;cursor:pointer;border-radius:4px;}
.dt-colmenu label:hover{background:var(--accent-tint2);}
.dt-table-wrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:4px;}
.dt-scroll{flex:1;overflow:auto;min-height:0;}
table.dt{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;}
table.dt thead th{position:sticky;top:0;background:#0F141B;color:#D6CFC0;z-index:4;padding:0;border-right:1px solid #1E2531;overflow:visible;}
table.dt thead th .th-inner{padding:9px 12px;display:flex;flex-direction:column;gap:4px;position:relative;min-height:36px;}
table.dt thead th .th-row{display:flex;align-items:center;gap:6px;}
table.dt thead th .th-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;line-height:1.3;}
table.dt thead th .th-label.no-sort{cursor:default;}
table.dt thead th .sort-ic{font-size:9px;color:var(--accent);width:10px;flex:none;}
table.dt thead th .search-ic{margin-left:auto;cursor:pointer;color:#6B7280;flex:none;font-size:11px;transition:color .15s;}
table.dt thead th .search-ic:hover{color:var(--accent);}
table.dt thead th .search-ic.active{color:var(--accent);}
table.dt thead th .th-filter{margin-top:3px;}
table.dt thead th .th-filter input{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #2D3545;background:#0A0E14;color:#E8E0D0;font-size:11.5px;}
table.dt thead th .th-filter input::placeholder{color:#5A6070;}
table.dt thead th .resize-handle{position:absolute;right:-4px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:5;}
table.dt thead th .resize-handle:hover,table.dt thead th .resize-handle.active{background:rgba(180,134,43,.4);}
table.dt thead th.sno-col{background:#080C12;padding:0;}
table.dt thead th.sno-col .th-inner{padding:6px 4px;min-height:auto;}
table.dt thead th.sno-col .th-label{cursor:default;color:#8A8479;font-size:9px;}
table.dt thead th.filtered{background:#2A1F10 !important;}
table.dt tbody td{padding:8px 12px;border-bottom:1px solid var(--line-light);border-right:1px solid #F2F0EA;font-size:12.5px;white-space:normal;word-break:break-word;vertical-align:middle;overflow-wrap:anywhere;}
table.dt tbody td.sno-cell{text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;background:#FAFAF7;border-right:1.5px solid var(--line);vertical-align:middle;padding:6px 4px;width:38px;}
table.dt tbody tr:nth-child(even){background:#FAFAF7;}
table.dt tbody tr:nth-child(even) td.sno-cell{background:#F2F0EA;}
table.dt tbody tr:hover{background:var(--accent-tint2);}
table.dt tbody tr:hover td.sno-cell{background:var(--accent-tint);}
.code-pill{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:var(--accent-dark);background:var(--accent-tint);border-radius:5px;padding:3px 8px;display:inline-block;}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink-secondary);margin-bottom:6px;font-weight:600;}
.dt-pagination{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:none;background:var(--surface);border-top:1.5px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted);font-weight:500;min-height:40px;}
.dt-pagination .pp{display:flex;align-items:center;gap:8px;}
.dt-pagination select{padding:5px 10px;border:1.5px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-weight:600;}
.dt-pagination .range-info{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-secondary);font-weight:600;}
.dt-pagination .nav{display:flex;align-items:center;gap:4px;margin-left:auto;}
.dt-pagination .nav button{border:1.5px solid var(--line);background:#fff;border-radius:4px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--ink-secondary);font-size:12px;transition:all .12s;}
.dt-pagination .nav button:disabled{opacity:.35;cursor:default;}
.dt-pagination .nav button:not(:disabled):hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.dt-pagination .pageinfo{font-weight:600;color:var(--ink-secondary);white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:11.5px;}


.entry-toolbar{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 12px;display:flex;align-items:center;gap:12px;margin-bottom:4px;flex:none;}
.entry-panels{display:flex;gap:8px;flex:1;min-height:0;overflow:hidden;flex-direction:column;}
.entry-panel{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;}
.panel-head{padding:3px 10px;font-size:10px;font-weight:700;color:var(--ink-secondary);border-bottom:1px solid var(--line-light);background:var(--accent-tint2);display:flex;align-items:center;gap:6px;flex:none;}
.panel-count{font-weight:500;color:var(--muted);font-size:9.5px;}
.panel-foot{padding:4px 8px;border-top:1px solid var(--line-light);flex:none;display:flex;align-items:center;gap:8px;}
.entry-scroll{flex:1;min-height:0;overflow:auto;}
table.entry{border-collapse:separate;border-spacing:0;}
table.entry thead th{background:#0F141B;color:#D6CFC0;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:11px 10px;text-align:left;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;font-weight:600;position:sticky;top:0;z-index:2;position:relative;line-height:1.3;}
table.entry thead th .eresize{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3;}
table.entry thead th .eresize:hover{background:rgba(180,134,43,.5);}
table.entry tbody td{padding:4px 5px;border-bottom:1px solid var(--line-light);vertical-align:middle;}
table.entry tbody tr:nth-child(even){background:#FAFAF7;}
table.entry tbody tr:hover{background:var(--accent-tint2);}
table.entry .rownum{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);text-align:center;width:28px;}
table.entry input{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);transition:border .15s;}
table.entry input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint);}
table.entry input.num{font-family:'JetBrains Mono',monospace;text-align:right;}
table.entry input.cell-ro{background:#F5F4F0;color:var(--muted);border-color:#ECEAE4;cursor:not-allowed;}
html.dark table.entry input.cell-ro{background:#0F141B;color:var(--muted);border-color:#2A2F38;}
table.entry textarea{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-family:inherit;font-size:12px;line-height:1.4;resize:vertical;min-height:32px;max-height:120px;transition:border .15s;}
table.entry textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint);}
html.dark table.entry textarea{background:#1A1F28;border-color:#2A2F38;color:var(--ink);}
html.dark table.entry textarea:focus{background:#0F141B;border-color:var(--accent);}
table.entry select{width:100%;padding:7px 9px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:12px;}
table.entry select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint);}
.trash-btn{border:none;background:transparent;color:var(--danger);cursor:pointer;padding:6px;border-radius:6px;line-height:1;display:inline-flex;align-items:center;justify-content:center;opacity:.6;transition:all .15s;}
.trash-btn:hover{background:var(--danger-tint);opacity:1;}


/* Material Rec Add - Card-style sections */
.mat-add-container{flex:1;min-height:0;overflow-y:auto;padding:8px 0;}
.mat-cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.mat-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:visible;}
.mat-card.full-width{grid-column:1/-1;}
.mat-card-head{padding:8px 14px;font-size:11px;font-weight:700;color:var(--ink-secondary);border-bottom:1px solid var(--line-light);background:var(--accent-tint2);display:flex;align-items:center;gap:8px;letter-spacing:.02em;}

.mat-top-field label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

/* Typeable dropdown */

.typeable-dd input{width:100%;}
.typeable-dd .dd-list{position:fixed;max-height:200px;overflow-y:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:9999;display:none;min-width:200px;}
.typeable-dd .dd-list.open{display:block;}
.typeable-dd .dd-item{padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line-light);}
.typeable-dd .dd-item:hover{background:var(--accent-tint2);}

.typeable-dd .dd-empty{padding:8px 12px;font-size:11px;color:var(--muted);font-style:italic;}

/* Drag & drop upload zone */
.dropzone{border:2px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s;background:#FAFAF7;min-width:140px;flex:1;max-width:240px;}

/* ============================= STATE ============================= */
function dtState(){return{sort:null,dir:1,hidden:new Set(),filters:{},filterOpen:null,widths:{},page:1,pageSize:50,dateFilters:{}};}

var S = {
  ready:false, loadError:'', user:null, page:'login', syncing:false, sidebarOpen:true, sidebarExpanded:false,

try{ S.darkMode=localStorage.getItem('matrec_dark_mode')==='true'; if(S.darkMode)document.documentElement.classList.add('dark'); }catch(e){}

/* ============================= APPS SCRIPT BRIDGE ============================= */
function runServer(fnName,arg){
  return new Promise(function(resolve,reject){
    if(typeof google==='undefined'||!google.script||!google.script.run){
      reject(new Error('google.script.run not available'));return;
    }
    var call=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(err){reject(new Error(err.message||String(err)));});
    if(arg===undefined) call[fnName](); else call[fnName](arg);
  });
}

/* ============================= HELPERS ============================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
function trashIcon(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';}
function isDateColumn(key){ return key==='timestamp'||key==='dueDate'||key==='invoiceDate'||key==='dated'||key==='dueOn'; }

function formatIndianCurrency(num){
  if(num===0)return '0';
  var isNeg=num<0;if(isNeg)num=-num;
  var str=Math.round(num).toString();
  var last3=str.substring(str.length-3);
  var rest=str.substring(0,str.length-3);
  if(rest.length>0){
    rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
    return (isNeg?'-':'')+rest+','+last3;
  }
  return (isNeg?'-':'')+last3;
}

function parseDT(v){
  if(v==null)return null;
  var s=String(v).trim();if(!s)return null;
  var M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  var m=s.match(/^(\d{1,2})[-\/\s]([A-Za-z]{3,})[-\/\s](\d{4})(?:[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    var day=+m[1],mon=M[m[2].slice(0,3).toLowerCase()],yr=+m[3];
    if(mon===undefined)return null;
    var hh=+(m[4]||0),mm=+(m[5]||0),ss=+(m[6]||0);
    return new Date(yr,mon,day,hh,mm,ss).getTime();
  }
  var t=Date.parse(s);return isNaN(t)?null:t;
}

function fmtNow(){var d=new Date();var Mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];var p=function(n){return String(n).padStart(2,'0');};return p(d.getDate())+'-'+Mo[d.getMonth()]+'-'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}

function showToast(msg,isErr){
  S.toast={msg:msg,isErr:isErr};render();
  setTimeout(function(){S.toast=null;var t=document.querySelector('.toast');if(t)t.remove();},3000);
}

/* Upload file to Google Drive (reads as base64, sends to server) */
function uploadFileToDrive(file,callback){
  var reader=new FileReader();
  reader.onload=function(){
    var base64=reader.result.split(',')[1];
    runServer('uploadFileToDriveAI',{data:base64,fileName:file.name,mimeType:file.type||'application/octet-stream'}).then(function(res){
      if(res&&res.status==='ok'){callback(null,{name:file.name,url:res.url});}
      else{callback(res?res.message:'Upload failed');}
    }).catch(function(err){callback(err.message);});
  };
  reader.readAsDataURL(file);
}


/* ============================= CLOCK + AUTO-REFRESH ============================= */
var AUTO_REFRESH_MINUTES = 10;

function startClock(){
  setInterval(function(){
    var el=document.getElementById('liveClock');if(!el)return;
    var d=new Date();var h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
    var ampm=h>=12?'PM':'AM';var h12=h%12||12;var pad=function(n){return String(n).padStart(2,'0');};
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    el.textContent=pad(d.getDate())+'-'+months[d.getMonth()]+'-'+d.getFullYear()+' \u00b7 '+pad(h12)+':'+pad(m)+':'+pad(s)+' '+ampm;
  },1000);
  setInterval(function(){
    if(S.user&&!S.syncing){ silentRefreshAI(); }
  }, AUTO_REFRESH_MINUTES * 60 * 1000);
}

async function silentRefreshAI(){
  try{
    var perms={matRecView:S.user.matRecView,matRecAdd:S.user.matRecAdd,poReceived:S.user.poReceived};
    var data=await runServer('getBootstrapDataAI',perms);
    if(data){ S.matRecResp=data.matRecResp||[]; S.poReceived=data.poReceived||[]; }
    render();
  }catch(e){}
}

/* ============================= LOGIN ============================= */
async function loadAll(){
  S.ready=false;render();
  try{
    await runServer('getLoginDataAI');
    S.loadError='';
  }catch(err){
    S.loadError=err.message;
  }
  S.ready=true;render();startClock();
}

async function doLogin(id,pw){
  S.loginError='';render();
  try{
    var result=await runServer('validateLoginAI',{id:id.trim(),password:pw});
    if(!result||!result.success){
      S.loginError=result?result.error:'Login failed.';render();return;
    }
    // Show success toast ON LOGIN PAGE first
    S.user=result.user;
    S.loginError='';
    S.toast={msg:'Login Successful \u2713 Welcome, '+S.user.name,isErr:false};
    render(); // re-render login page WITH green toast visible
    // Wait 800ms so user sees the toast, then navigate
    await new Promise(function(r){setTimeout(r,800);});
    S.toast=null; // CLEAR toast before navigating
    if(S.user.matRecView||S.user.matRecAdd) S.page='matRecView';
    else if(S.user.poReceived) S.page='poRecView';
    else S.page='matRecView';
    render();
    S.syncing=true;render();
    var perms={matRecView:S.user.matRecView,matRecAdd:S.user.matRecAdd,poReceived:S.user.poReceived};
    var data=await runServer('getBootstrapDataAI',perms);
    if(data){ S.matRecResp=data.matRecResp||[]; S.poReceived=data.poReceived||[]; }
    try{ var dd=await runServer('getDropdownDataAI'); if(dd&&dd.brands) S.dropdownBrands=dd.brands; }catch(e){}
    await loadColWidthsFromServer();
    S.syncing=false;render();
  }catch(err){
    S.loginError='Login failed: '+err.message;S.syncing=false;render();
  }
}

async function refreshData(){
  S.syncing=true;render();
  try{
    var perms={matRecView:S.user.matRecView,matRecAdd:S.user.matRecAdd,poReceived:S.user.poReceived};
    var data=await runServer('getBootstrapDataAI',perms);
    if(data){ S.matRecResp=data.matRecResp||[]; S.poReceived=data.poReceived||[]; }
    try{var fresh=await runServer('getUserPermissionsAI',S.user.id);if(fresh)S.user=Object.assign({},S.user,fresh);}catch(e){}
    S.syncing=false;
    S.dt.filters={};S.dt.filterOpen=null;S.dt.page=1;
    S.dtPo.filters={};S.dtPo.filterOpen=null;S.dtPo.page=1;
    S.globalSearch='';S.globalSearchPo='';
    showToast('Refreshed: '+S.matRecResp.length+' mat rows, '+S.poReceived.length+' PO rows.',false);
  }catch(err){S.syncing=false;showToast('Refresh failed: '+err.message,true);}
}

/* ============================= COLUMN WIDTH PERSISTENCE ============================= */
var saveWidthTimer=null;
function saveColWidthsToServer(page,widths){
  clearTimeout(saveWidthTimer);
  saveWidthTimer=setTimeout(function(){
    runServer('saveUserSettingsAI',{page:page,widths:widths}).catch(function(e){});
  },1000);
}
async function loadColWidthsFromServer(){
  try{
    var matW=await runServer('loadUserSettingsAI',{page:'matRecView'});
    if(matW&&matW.widths)S.dt.widths=matW.widths;
    var poW=await runServer('loadUserSettingsAI',{page:'poRecView'});
    if(poW&&poW.widths)S.dtPo.widths=poW.widths;
    var entW=await runServer('loadUserSettingsAI',{page:'matRecEntry'});
    if(entW&&entW.widths)S.entryWidths=entW.widths;
  }catch(e){}
}

function renderLogin(){

/* ============================= RENDER DATA TABLE (Mat Rec View) ============================= */
function renderDataTable(){
  var st=S.dt;
  var rows=S.matRecResp.slice();
  var totalUnfiltered=rows.length;

  if(S.globalSearch){
    var gq=S.globalSearch.toLowerCase();
    rows=rows.filter(function(r){return Object.values(r).some(function(v){return String(v==null?'':v).toLowerCase().includes(gq);});});
  }
  Object.entries(st.filters).forEach(function(entry){
    var k=entry[0],v=entry[1];if(!v)return;
    rows=rows.filter(function(r){return String(r[k]==null?'':r[k]).toLowerCase().includes(v.toLowerCase());});
  });
  Object.entries(st.dateFilters||{}).forEach(function(entry){
    var k=entry[0],df=entry[1];if(!df)return;
    var from=df.from?parseDT(df.from):null;
    var to=df.to?parseDT(df.to+' 23:59:59'):null;
    if(!from&&!to)return;
    rows=rows.filter(function(r){var d=parseDT(r[k]);if(d===null)return false;if(from&&d<from)return false;if(to&&d>to)return false;return true;});
  });

  if(st.sort){
    var sortKey=st.sort;var sortDir=st.dir;var isDate=isDateColumn(sortKey);
    rows.sort(function(a,b){
      var x=a[sortKey],y=b[sortKey];
      if(isDate){var dx=parseDT(x),dy=parseDT(y);var ex=(dx===null),ey=(dy===null);if(ex&&ey)return 0;if(ex)return 1;if(ey)return -1;return (dx-dy)*sortDir;}
      var nx=parseFloat(x),ny=parseFloat(y);
      if(!isNaN(nx)&&!isNaN(ny)&&String(nx)===String(x).trim()&&String(ny)===String(y).trim()){return (nx-ny)*sortDir;}
      var sx=String(x==null?'':x).toLowerCase(),sy=String(y==null?'':y).toLowerCase();
      if(!sx&&!sy)return 0;if(!sx)return 1;if(!sy)return -1;
      if(sx<sy)return -1*sortDir;if(sx>sy)return 1*sortDir;return 0;
    });
  }

  var total=rows.length;var ps=st.pageSize;
  var tp=Math.max(1,Math.ceil(total/ps));
  if(st.page>tp)st.page=tp;if(st.page<1)st.page=1;
  var si=(st.page-1)*ps;var pageRows=rows.slice(si,si+ps);
  var visCols=MAT_REC_COLS.filter(function(c){return !st.hidden.has(c.key);});
  var hasActiveFilters=Object.values(st.filters).some(function(v){return !!v;})||Object.keys(st.dateFilters||{}).length>0||!!S.globalSearch;

  var snoW=38;
  var snoTh='<th class="sno-col" style="width:'+snoW+'px;min-width:'+snoW+'px;max-width:'+snoW+'px;"><div class="th-inner"><div class="th-row"><span class="th-label no-sort">S.No</span></div></div></th>';

  var hdr=snoTh+visCols.map(function(c){
    var w=st.widths[c.key]||c.width||150;
    var sortIcon=st.sort===c.key?(st.dir===1?'\u25B2':'\u25BC'):'';
    var isFilterOpen=st.filterOpen===c.key;
    var hasFilter=!!st.filters[c.key]||(st.dateFilters&&!!st.dateFilters[c.key]);
    var isDate=isDateColumn(c.key);var searchIcon=isDate?'\uD83D\uDCC5':'\u2315';
    var filterHtml='';
    if(isFilterOpen){filterHtml='<div class="th-filter"><input type="text" placeholder="Filter '+esc(c.label)+'\u2026" data-action="filter" data-col="'+c.key+'" value="'+esc(st.filters[c.key]||'')+'"></div>';}
    return '<th class="'+(hasFilter?'filtered':'')+'" style="width:'+w+'px;min-width:'+w+'px;max-width:'+w+'px;" data-col="'+c.key+'"><div class="th-inner"><div class="th-row"><span class="th-label" data-action="sort" data-col="'+c.key+'">'+esc(c.label)+'</span><span class="sort-ic">'+sortIcon+'</span><span class="search-ic'+(hasFilter?' active':'')+'" data-action="togglesearch" data-col="'+c.key+'">'+searchIcon+'</span></div>'+filterHtml+'<div class="resize-handle" data-action="resize" data-col="'+c.key+'"></div></div></th>';
  }).join('');

  var bod=pageRows.length?pageRows.map(function(r,idx){
    var sno=si+idx+1;
    return '<tr><td class="sno-cell">'+sno+'</td>'+visCols.map(function(c){
      var v=r[c.key]==null?'':r[c.key];
      if(c.pill&&v) return '<td><span class="code-pill">'+esc(v)+'</span></td>';
      if(c.mono) return '<td style="font-family:\'JetBrains Mono\',monospace;font-size:11.5px;">'+esc(v)+'</td>';
      return '<td>'+esc(v)+'</td>';
    }).join('')+'</tr>';
  }).join(''):'<tr><td colspan="'+(visCols.length+1)+'"><div class="empty-state"><div class="big">No matching rows</div>Adjust filters or no data available yet.</div></td></tr>';

  var rf=total===0?0:si+1;var rt=Math.min(si+ps,total);
  var canAdd=S.user&&S.user.matRecAdd;

  return '<div class="dt-toolbar">'+
    '<div class="count">'+total+' of '+totalUnfiltered+' rows'+(hasActiveFilters?' (filtered)':'')+'</div>'+
    '<button class="btn btn-ghost" data-action="dt-refresh" style="padding:7px 14px;">'+(S.syncing?'\u27F3 Refreshing\u2026':'\u27F3 Refresh')+'</button>'+
    '<button class="btn btn-ghost" data-action="dt-reset-filters" style="padding:7px 14px;'+(hasActiveFilters?'color:var(--danger);border-color:var(--danger);':'opacity:0.4;cursor:default;')+'">\u2715 Reset Filters</button>'+
    '<input type="text" data-action="globalsearch" placeholder="\uD83D\uDD0D Search all columns\u2026" value="'+esc(S.globalSearch||'')+'" style="padding:6px 12px;border:1.5px solid var(--line);border-radius:4px;font-size:12px;width:200px;background:var(--surface);color:var(--ink);">'+
    '<div class="dt-colmenu-wrap">'+
      '<button class="btn btn-ghost" data-action="togglecolmenu" style="padding:7px 14px;">Columns \u25BE</button>'+
      (S.colMenuOpen?'<div class="dt-colmenu"><div class="h">Show / Hide Columns</div>'+MAT_REC_COLS.map(function(c){return '<label><input type="checkbox" data-action="togglecol" data-col="'+c.key+'" '+(st.hidden.has(c.key)?'':'checked')+'> '+esc(c.label)+'</label>';}).join('')+'</div>':'')+

  '<div class="dt-table-wrap">'+
    '<div class="dt-scroll"><table class="dt"><thead><tr>'+hdr+'</tr></thead><tbody>'+bod+'</tbody></table></div>'+
    '<div class="dt-pagination">'+
      '<div class="pp">Rows per page: <select data-action="pagesize">'+PAGE_SIZE_OPTIONS.map(function(n){return '<option value="'+n+'" '+(st.pageSize===n?'selected':'')+'>'+n+'</option>';}).join('')+'</select></div>'+
      '<div class="range-info">'+(total===0?'0 rows':rf+'\u2013'+rt+' of '+total)+'</div>'+
      '<div class="nav">'+
        '<button data-action="pagefirst" '+(st.page<=1?'disabled':'')+'>&#171; First</button>'+
        '<button data-action="pageprev" '+(st.page<=1?'disabled':'')+'>&#8249; Prev</button>'+
        '<span class="pageinfo">'+st.page+' / '+tp+'</span>'+
        '<button data-action="pagenext" '+(st.page>=tp?'disabled':'')+'>Next &#8250;</button>'+
        '<button data-action="pagelast" '+(st.page>=tp?'disabled':'')+'>Last &#187;</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function getUniqueVendors(){
  var vendors={};
  S.poReceived.forEach(function(r){
    var v=String(r.supplier||r.buyerName||'').trim();
    if(v) vendors[v]=true;
  });
  return Object.keys(vendors).sort();
}

/* Get PO numbers filtered by vendor (if vendor empty, show ALL POs) */
function getPOsForVendor(vendor){
  var pos={};
  var vLow=(vendor||'').toLowerCase();
  S.poReceived.forEach(function(r){
    var rv=String(r.supplier||r.buyerName||'').trim().toLowerCase();
    if(!vLow||rv===vLow){
      var po=String(r.voucherNo||r.salesOrderNo||'').trim();
      if(po) pos[po]=true;
    }
  });
  return Object.keys(pos).sort();
}

/* Calculate already received qty for a specific PO+vendor+item */
function getAlreadyReceived(poNo,vendorName,itemName){
  var total=0;
  var pLow=(poNo||'').toLowerCase();
  var vLow=(vendorName||'').toLowerCase();
  var iLow=(itemName||'').toLowerCase();
  S.matRecResp.forEach(function(r){
    if(String(r.poNo||'').toLowerCase()===pLow && String(r.vendorName||'').toLowerCase()===vLow && String(r.itemName||'').toLowerCase()===iLow){
      var q=parseFloat(r.recQty);
      if(!isNaN(q)) total+=q;
    }
  });
  return total;
}

/* Get next outward batch number from DROPDOWN sheet B2 prefix + auto-increment */
function getNextOutwardBatchNo(){
  var prefix='OB';
  if(S.dropdownBrands&&S.dropdownBrands.length>0){
    /* prefix from B2 is handled via separate fetch if needed */
  }
  var maxNum=0;
  S.matRecResp.forEach(function(r){
    var ob=String(r.outwardBatchNo||'');
    var m=ob.match(/(\d+)$/);
    if(m){var n=parseInt(m[1],10);if(n>maxNum)maxNum=n;}
  });
  return maxNum+1;
}

/* When PO is selected, auto-fill rows from PO data */
function onPoSelected(poNo){
  var E=S.matRecEntry;if(!E)return;
  var vendor=E.topFields.vendorName;
  var poLow=(poNo||'').toLowerCase();
  var matchingRows=S.poReceived.filter(function(r){
    var rpo=String(r.voucherNo||r.salesOrderNo||'').trim().toLowerCase();
    return rpo===poLow;
  });
  if(!matchingRows.length)return;
  E.rows=matchingRows.map(function(r,idx){
    var itemName=String(r.description||'').trim();
    var alreadyRec=getAlreadyReceived(poNo,vendor,itemName);
    var poQty=parseFloat(r.quantity)||0;
    var pending=poQty-alreadyRec;
    if(pending<0)pending=0;
    return {
      changeBrand:'',
      brand:String(r.brand||'').trim(),
      salesOrderId:String(r.salesOrderNo||'').trim(),
      itemName:itemName,
      pendingQty:String(pending),
      recQty:'',
      cancelQty:'',
      poRate:String(r.rate||'').trim(),
      size:String(r.size||'').trim(),
      unit:String(r.per||'').trim(),
      invoiceRate:'',
      inwardBatchNo:'',
      grossWeight:'',
      remarks:'',
      newUniqueNo:'',
      outwardBatchNo:'',
      matRecImage:[],
      poQuantity:poQty,
      alreadyReceived:alreadyRec
    };
  });
  recalcPendingTop();
  render();
}

/* Recalculate pending quantities */
function recalcPendingQty(rowIdx){
  var E=S.matRecEntry;if(!E)return;
  var r=E.rows[rowIdx];
  var poQty=parseFloat(r.poQuantity)||0;
  var recQ=parseFloat(r.recQty)||0;
  var canQ=parseFloat(r.cancelQty)||0;
  var already=parseFloat(r.alreadyReceived)||0;
  var pending=poQty-recQ-canQ-already;
  if(pending<0)pending=0;
  r.pendingQty=String(pending);
  recalcPendingTop();
}

function recalcPendingTop(){
  var E=S.matRecEntry;if(!E)return;
  var total=0;
  E.rows.forEach(function(r){var p=parseFloat(r.pendingQty)||0;total+=p;});
  E.topFields.pendingQtyTop=String(total);
}

async function submitMatRec(){
  var E=S.matRecEntry;if(!E)return;
  var T=E.topFields;
  // Only save rows where recQty > 0 or cancelQty > 0
  var validRows=E.rows.filter(function(r){
    var rec=parseFloat(r.recQty)||0;
    var canc=parseFloat(r.cancelQty)||0;
    return rec>0||canc>0;
  });
  if(!validRows.length){showToast('No rows with REC QTY or Cancel QTY filled. Fill at least one.',true);return;}

  // Validate mandatory fields for rows being saved
  var mandatoryFields=['invoiceRate','inwardBatchNo','grossWeight','remarks'];
  var hasError=false;
  validRows.forEach(function(r){
    mandatoryFields.forEach(function(f){
      if(!r[f])hasError=true;
    });
  });
  if(hasError){
    E.showErrors=true;render();
    showToast('Please fill highlighted mandatory cells (Invoice Rate, Inward Batch No, Gross Weight, Remarks)',true);
    return;
  }

  S.saving=true;render();showSavingOverlay('Saving material entry\u2026');
  try{
    // Re-fetch fresh data to get latest outward batch (concurrency safety)
    try{
      var freshData=await runServer('getBootstrapDataAI',{matRecView:true,matRecAdd:true,poReceived:false});
      if(freshData&&freshData.matRecResp) S.matRecResp=freshData.matRecResp;
    }catch(e){}
    // Re-assign outward batch numbers with latest data
    var freshBatch=getNextOutwardBatchNo();
    var bIdx=0;
    validRows.forEach(function(r){
      if(parseFloat(r.recQty)>0){
        r.outwardBatchNo=String(freshBatch+bIdx);
        bIdx++;
      } else {
        r.outwardBatchNo='';
      }
    });
    var result=await runServer('saveMatRecEntriesAI',{
      topFields:T,rows:validRows,loginId:S.user.id,loginName:S.user.name||S.user.id
    });
    S.saving=false;hideSavingOverlay();
    if(result.status!=='ok'){showToast('Save failed: '+(result.message||'unknown'),true);return;}
    var ts=fmtNow();
    validRows.forEach(function(r){
      S.matRecResp.push(Object.assign({},T,r,{timestamp:ts,loginName:S.user.name||S.user.id}));
    });
    S.matRecEntry=null;S.page='matRecView';
    S.lastMatRecNo=result.matRecNo||'';
    showToast('Saved '+result.saved+' material received row(s). ('+S.lastMatRecNo+')',false);
  }catch(err){S.saving=false;hideSavingOverlay();showToast('Save failed: '+err.message,true);}
}

/* ============================= DATE RANGE PICKER ============================= */
var drState=null;
var DR_PRESETS=[
  {key:'today',label:'Today',fn:function(){var t=startOfDayAI(new Date());return[t,t];}},
  {key:'yesterday',label:'Yesterday',fn:function(){var d=new Date();d.setDate(d.getDate()-1);return[startOfDayAI(d),startOfDayAI(d)];}},
  {key:'thisWeek',label:'This Week',fn:function(){var d=new Date();var s=new Date(d);s.setDate(d.getDate()-d.getDay());return[startOfDayAI(s),startOfDayAI(d)];}},
  {key:'lastWeek',label:'Last Week',fn:function(){var d=new Date();var e2=new Date(d);e2.setDate(d.getDate()-d.getDay()-1);var s=new Date(e2);s.setDate(e2.getDate()-6);return[startOfDayAI(s),startOfDayAI(e2)];}},
  {key:'last7',label:'Last 7 Days',fn:function(){var d=new Date();var s=new Date(d);s.setDate(d.getDate()-6);return[startOfDayAI(s),startOfDayAI(d)];}},
  {key:'last30',label:'Last 30 Days',fn:function(){var d=new Date();var s=new Date(d);s.setDate(d.getDate()-29);return[startOfDayAI(s),startOfDayAI(d)];}},
  {key:'thisMonth',label:'This Month',fn:function(){var d=new Date();return[startOfDayAI(new Date(d.getFullYear(),d.getMonth(),1)),startOfDayAI(d)];}},
  {key:'lastMonth',label:'Last Month',fn:function(){var d=new Date();var e2=new Date(d.getFullYear(),d.getMonth(),0);var s=new Date(e2.getFullYear(),e2.getMonth(),1);return[startOfDayAI(s),startOfDayAI(e2)];}},
  {key:'past',label:'All Past',fn:function(){return[startOfDayAI(new Date(2020,0,1)),startOfDayAI(new Date())];}}
];
function startOfDayAI(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function fmtDRAI(d){if(!d)return'';var p=function(n){return String(n).padStart(2,'0');};var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return p(d.getDate())+'-'+M[d.getMonth()]+'-'+d.getFullYear();}
function fmtISOAI(d){if(!d)return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function openDateRangeAI(tableId,col){
  var st=(tableId==='dtPo')?S.dtPo:S.dt;
  var existing=st.dateFilters&&st.dateFilters[col];
  var from=existing&&existing.from?new Date(existing.from+'T00:00:00'):null;
  var to=existing&&existing.to?new Date(existing.to+'T00:00:00'):null;
  drState={tableId:tableId,col:col,from:from,to:to,month1:new Date((from||new Date()).getFullYear(),(from||new Date()).getMonth(),1),presetKey:null,anchorCol:col};
  renderDRAI();
}
function closeDRAI(){drState=null;var el=document.getElementById('drPopupAI');if(el)el.remove();}
function applyDRAI(){
  if(!drState)return;
  var st=(drState.tableId==='dtPo')?S.dtPo:S.dt;
  if(!st.dateFilters)st.dateFilters={};
  if(drState.from||drState.to){st.dateFilters[drState.col]={from:fmtISOAI(drState.from),to:fmtISOAI(drState.to)};}
  else{delete st.dateFilters[drState.col];}
  st.page=1;closeDRAI();render();
}
function drSelectDayAI(d){
  if(!drState)return;
  if(!drState.from||drState.to){drState.from=d;drState.to=null;drState.presetKey=null;}
  else{if(d<drState.from){drState.to=drState.from;drState.from=d;}else drState.to=d;drState.presetKey=null;}
  renderDRAI();
}
function drPresetAI(key){var p=DR_PRESETS.find(function(x){return x.key===key;});if(!p||!drState)return;var r=p.fn();drState.from=r[0];drState.to=r[1];drState.presetKey=key;drState.month1=new Date(r[0].getFullYear(),r[0].getMonth(),1);renderDRAI();}

function buildCalAI(year,month){
  var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var first=new Date(year,month,1);var startDow=first.getDay();
  var dim=new Date(year,month+1,0).getDate();var prevDays=new Date(year,month,0).getDate();
  var today=startOfDayAI(new Date());var cells='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){cells+='<div class="day-label">'+d+'</div>';});
  for(var i=0;i<startDow;i++){cells+='<div class="day other">'+(prevDays-startDow+1+i)+'</div>';}
  for(var d=1;d<=dim;d++){
    var dt=new Date(year,month,d);var cls='day';
    if(dt.getTime()===today.getTime())cls+=' today';
    if(drState){
      if(drState.from&&dt.getTime()===drState.from.getTime())cls+=' range-start';
      if(drState.to&&dt.getTime()===drState.to.getTime())cls+=' range-end';
      if(drState.from&&drState.to&&dt>drState.from&&dt<drState.to)cls+=' in-range';
      if(drState.from&&!drState.to&&dt.getTime()===drState.from.getTime())cls+=' range-start range-end';
    }
    cells+='<div class="'+cls+'" data-drday="'+fmtISOAI(dt)+'">'+d+'</div>';
  }
  var rem=(7-(startDow+dim)%7)%7;for(var i=1;i<=rem;i++){cells+='<div class="day other">'+i+'</div>';}
  return{label:M[month]+' '+year,cells:cells};
}


function renderDRAI(){
  var el=document.getElementById('drPopupAI');
  if(!el){el=document.createElement('div');el.id='drPopupAI';document.body.appendChild(el);}
  if(!drState){el.remove();return;}
  var m1y=drState.month1.getFullYear(),m1m=drState.month1.getMonth();
  var m2=new Date(m1y,m1m+1,1);
  var cal1=buildCalAI(m1y,m1m),cal2=buildCalAI(m2.getFullYear(),m2.getMonth());
  var preHtml=DR_PRESETS.map(function(p){return '<button class="'+(drState.presetKey===p.key?'active':'')+'" data-drpreset="'+p.key+'">'+p.label+'</button>';}).join('');
  var disp=(drState.from?fmtDRAI(drState.from):'--')+' \u2013 '+(drState.to?fmtDRAI(drState.to):'--');
  el.className='dr-popup';
  var anchor=document.querySelector('th[data-col="'+drState.anchorCol+'"] .search-ic');
  if(anchor){
    var rect=anchor.getBoundingClientRect();
    el.style.cssText='position:fixed;z-index:60;top:'+Math.min(rect.bottom+6,window.innerHeight-380)+'px;left:'+Math.max(10,Math.min(rect.left-100,window.innerWidth-580))+'px;';
  } else {
    el.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:60;';
  }
  el.innerHTML='<div class="dr-presets">'+preHtml+'</div>'+
    '<div class="dr-cal-area"><div class="dr-cal-months">'+
      '<div class="dr-cal-month"><div class="dr-cal-head"><button data-drnav="prev">\u2039</button><span class="month-label">'+cal1.label+'</span><span></span></div><div class="dr-cal-grid">'+cal1.cells+'</div></div>'+
      '<div class="dr-cal-month"><div class="dr-cal-head"><span></span><span class="month-label">'+cal2.label+'</span><button data-drnav="next">\u203A</button></div><div class="dr-cal-grid">'+cal2.cells+'</div></div>'+
    '</div><div class="dr-foot"><span class="dr-display">'+disp+'</span><div class="dr-btns"><button class="btn btn-ghost" data-draction="cancel" style="padding:6px 14px;font-size:11px;">Cancel</button><button class="btn btn-gold" data-draction="apply" style="padding:6px 14px;font-size:11px;">Apply</button></div></div></div>';
}

// DR popup clicks
document.addEventListener('click',function(e){
  if(!drState)return;var popup=document.getElementById('drPopupAI');if(!popup)return;
  if(!popup.contains(e.target)&&!e.target.closest('.search-ic')){closeDRAI();return;}

/* ============================= TYPEABLE DROPDOWN LOGIC ============================= */
var ddOpenType=null; // 'vendor' or 'po'

function showDDList(type){
  // Close ALL other dropdowns first
  if(type!=='vendor') hideDDList('vendor');
  if(type!=='po') hideDDList('po');
  var listEl=document.getElementById('ddlist-'+type);
  if(!listEl)return;
  var inputEl=listEl.parentElement.querySelector('input');
  var val=(inputEl?inputEl.value:'').toLowerCase();
  var items=[];
  if(type==='vendor') items=getUniqueVendors();
  else if(type==='po') items=getPOsForVendor(S.matRecEntry?S.matRecEntry.topFields.vendorName:'');
  var filtered=items.filter(function(it){return it.toLowerCase().indexOf(val)>=0;});
  if(!filtered.length){listEl.innerHTML='<div class="dd-empty">No matches found</div>';}
  else{listEl.innerHTML=filtered.map(function(it){return '<div class="dd-item" data-ddval="'+esc(it)+'">'+esc(it)+'</div>';}).join('');}
  // Position fixed below input
  if(inputEl){
    var rect=inputEl.getBoundingClientRect();
    listEl.style.top=(rect.bottom+2)+'px';
    listEl.style.left=rect.left+'px';
    listEl.style.width=Math.max(rect.width,220)+'px';
  }
  listEl.classList.add('open');
  ddOpenType=type;
}

function hideDDList(type){
  var listEl=document.getElementById('ddlist-'+type);
  if(listEl)listEl.classList.remove('open');
  if(ddOpenType===type)ddOpenType=null;
}

function selectDDItem(type,val){
  if(!S.matRecEntry)return;
  if(type==='vendor'){
    var prevVendor=S.matRecEntry.topFields.vendorName;
    S.matRecEntry.topFields.vendorName=val;
    // If vendor changed and there was already data filled, clear EVERYTHING
    if(prevVendor&&prevVendor.toLowerCase()!==val.toLowerCase()){
      S.matRecEntry.topFields.poNo='';
      S.matRecEntry.topFields.invoiceNumber='';
      S.matRecEntry.topFields.invoiceDate='';
      S.matRecEntry.topFields.dueDate='';
      S.matRecEntry.topFields.bandel='';
      S.matRecEntry.topFields.invoiceUpload=[];
      S.matRecEntry.topFields.lrImage=[];
      S.matRecEntry.topFields.lrBillVerified='';
      S.matRecEntry.topFields.ewayBill='';
      S.matRecEntry.topFields.ewayBillImage='';
      S.matRecEntry.topFields.addressGst='';
      S.matRecEntry.topFields.invQty='';
      S.matRecEntry.topFields.pendingQtyTop='';
      S.matRecEntry.rows=[];
      S.matRecEntry.showErrors=false;
    } else {
      S.matRecEntry.topFields.poNo='';
      S.matRecEntry.rows=[];
      S.matRecEntry.topFields.pendingQtyTop='';
      S.matRecEntry.showErrors=false;
    }
  } else if(type==='po'){
    S.matRecEntry.topFields.poNo=val;
    // Auto-fill vendor from PO data if vendor is empty
    if(!S.matRecEntry.topFields.vendorName){
      var poRows=S.poReceived.filter(function(r){
        return String(r.voucherNo||r.salesOrderNo||'').trim().toLowerCase()===val.toLowerCase();
      });
      if(poRows.length>0){
        var vendor=String(poRows[0].supplier||poRows[0].buyerName||'').trim();
        if(vendor) S.matRecEntry.topFields.vendorName=vendor;
      }
    }
    // Clear and re-fill rows when PO changes
    S.matRecEntry.rows=[];
    S.matRecEntry.showErrors=false;
    onPoSelected(val);
  }
  hideDDList(type);
  render();
  if(type==='vendor'){
    setTimeout(function(){var poInp=document.querySelector('[data-ddtype="po"]');if(poInp)poInp.focus();},100);
  }
}

          if(parseFloat(r.recQty)>0){
            if(!r.outwardBatchNo){
              r.outwardBatchNo=String(nextBatch+batchIdx);
            }
            batchIdx++;

            r.outwardBatchNo='';
          }
        });
        // Update pendingQtyTop display
        var topEl=document.querySelector('[data-mattop="pendingQtyTop"]');

      var ag=document.querySelector('input[data-action="poglobalsearch"]');if(ag){ag.focus();ag.setSelectionRange(pos,pos);}
    },350);return;

  if(el.getAttribute('data-action')==='filter'){
    var c=el.getAttribute('data-col');S.dt.filters[c]=el.value;
    clearTimeout(filterTimer);
    filterTimer=setTimeout(function(){S.dt.page=1;var pos=el.selectionStart;render();
      var ag=document.querySelector('input[data-action="filter"][data-col="'+c+'"]');if(ag){ag.focus();ag.setSelectionRange(pos,pos);}
    },350);
  }
  if(el.getAttribute('data-action')==='pofilter'){
    var c=el.getAttribute('data-col');S.dtPo.filters[c]=el.value;
    clearTimeout(filterTimer);
    filterTimer=setTimeout(function(){S.dtPo.page=1;var pos=el.selectionStart;render();
      var ag=document.querySelector('input[data-action="pofilter"][data-col="'+c+'"]');if(ag){ag.focus();ag.setSelectionRange(pos,pos);}

});

document.addEventListener('click',function(e){
  // DD item selection
  var ddItem=e.target.closest('.dd-item');
  if(ddItem&&ddOpenType){
    selectDDItem(ddOpenType,ddItem.getAttribute('data-ddval'));
    return;
  }
  // Row upload click
  var rowDz=e.target.closest('[data-rowdz]');
  if(rowDz&&S.matRecEntry){
    if(e.target.closest('.click-link'))return;
    var ri=parseInt(rowDz.getAttribute('data-rowdz'),10);
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*,.pdf,.doc,.docx';inp.multiple=true;
    inp.onchange=function(){
      if(inp.files.length){
        if(!Array.isArray(S.matRecEntry.rows[ri].matRecImage))S.matRecEntry.rows[ri].matRecImage=[];
        var pending=inp.files.length;
        showToast('Uploading '+pending+' file(s) to Drive...',false);
        for(var fi=0;fi<inp.files.length;fi++){
          (function(f){
            uploadFileToDrive(f,function(err,result){
              pending--;
              if(!err&&result){
                S.matRecEntry.rows[ri].matRecImage.push(result);
              } else {
                S.matRecEntry.rows[ri].matRecImage.push({name:f.name,url:'',error:err||'failed'});
              }
              if(pending<=0){render();showToast('Upload complete',false);}
            });
          })(inp.files[fi]);
        }
      }
    };
    inp.click();return;
  }

  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action');
  if(a==='toggle-sidebar'){
    // Only toggle if click is on sidebar itself, not on nav items
    if(!e.target.closest('.nav-item')&&!e.target.closest('.logout-btn')&&!e.target.closest('.brand')){
      S.sidebarExpanded=!S.sidebarExpanded;render();return;
    }
  }
  if(a==='toggle-theme'){
    S.darkMode=!S.darkMode;document.documentElement.classList.toggle('dark',S.darkMode);
    try{localStorage.setItem('matrec_dark_mode',S.darkMode?'true':'false');}catch(ex){}render();return;
  }
  if(a==='font-up'){S.fontSize=Math.min(130,S.fontSize+10);document.body.style.fontSize=S.fontSize+'%';try{localStorage.setItem('matrec_font_size',String(S.fontSize));}catch(ex){}render();return;}
  if(a==='font-down'){S.fontSize=Math.max(70,S.fontSize-10);document.body.style.fontSize=S.fontSize+'%';try{localStorage.setItem('matrec_font_size',String(S.fontSize));}catch(ex){}render();return;}
  if(a==='font-reset'){S.fontSize=100;document.body.style.fontSize='100%';try{localStorage.setItem('matrec_font_size','100');}catch(ex){}render();return;}
  if(a==='nav'){S.page=el.getAttribute('data-page');S.matRecEntry=null;render();return;}
  if(a==='logout'){S.user=null;S.page='login';render();return;}
  if(a==='dt-refresh'){S.dt.filters={};S.dt.dateFilters={};S.dt.filterOpen=null;S.dt.page=1;S.globalSearch='';refreshData();return;}
  if(a==='dt-reset-filters'){S.dt.filters={};S.dt.dateFilters={};S.dt.filterOpen=null;S.dt.page=1;S.globalSearch='';render();return;}
  if(a==='open-matrec-add'){openMatRecAdd();return;}
  if(a==='back-to-matview'){closeMatRecAdd();return;}
  if(a==='add-matrow'){if(S.matRecEntry){S.matRecEntry.rows.push(freshMatRecRow());render();}return;}
  if(a==='del-last-matrow'){if(S.matRecEntry&&S.matRecEntry.rows.length>1){S.matRecEntry.rows.pop();render();}return;}
  if(a==='del-matrow'){if(S.matRecEntry){var idx=parseInt(el.getAttribute('data-i'),10);S.matRecEntry.rows.splice(idx,1);if(!S.matRecEntry.rows.length)S.matRecEntry.rows.push(freshMatRecRow());render();}return;}
  if(a==='submit-matrec'){submitMatRec();return;}
  if(a==='reset-matrec'){if(S.matRecEntry)showConfirmPopup();return;}
  if(a==='confirm-yes'){hideConfirmPopup();S.matRecEntry=freshMatRecEntry();render();return;}
  if(a==='confirm-no'){hideConfirmPopup();return;}
  if(a==='pdf-punched'){generatePdfPunched();return;}
  if(a==='pdf-pending'){generatePdfPending();return;}
  if(a==='pdf-overall'){generatePdfOverall();return;}
  if(a==='sort'){var c=el.getAttribute('data-col');var st=S.dt;if(st.sort===c)st.dir*=-1;else{st.sort=c;st.dir=1;}st.page=1;render();return;}
  if(a==='togglesearch'){var c2=el.getAttribute('data-col');if(isDateColumn(c2)){openDateRangeAI('dt',c2);return;}S.dt.filterOpen=S.dt.filterOpen===c2?null:c2;render();if(S.dt.filterOpen){var inp2=document.querySelector('input[data-action="filter"][data-col="'+c2+'"]');if(inp2)inp2.focus();}return;}
  if(a==='togglecolmenu'){S.colMenuOpen=!S.colMenuOpen;render();return;}
  if(a==='togglecol'){var c3=el.getAttribute('data-col');if(S.dt.hidden.has(c3))S.dt.hidden.delete(c3);else S.dt.hidden.add(c3);render();S.colMenuOpen=true;return;}
  if(a==='pagefirst'){S.dt.page=1;render();return;}
  if(a==='pageprev'){S.dt.page=Math.max(1,S.dt.page-1);render();return;}
  if(a==='pagenext'){S.dt.page++;render();return;}
  if(a==='pagelast'){S.dt.page=999999;render();return;}
  if(a==='po-refresh'){S.dtPo.filters={};S.dtPo.dateFilters={};S.dtPo.filterOpen=null;S.dtPo.page=1;S.globalSearchPo='';refreshData();return;}
  if(a==='po-reset-filters'){S.dtPo.filters={};S.dtPo.dateFilters={};S.dtPo.filterOpen=null;S.dtPo.page=1;S.globalSearchPo='';render();return;}
  if(a==='posort'){var pc=el.getAttribute('data-col');if(S.dtPo.sort===pc)S.dtPo.dir*=-1;else{S.dtPo.sort=pc;S.dtPo.dir=1;}S.dtPo.page=1;render();return;}
  if(a==='potogglefilter'){var pc2=el.getAttribute('data-col');if(isDateColumn(pc2)){openDateRangeAI('dtPo',pc2);return;}S.dtPo.filterOpen=S.dtPo.filterOpen===pc2?null:pc2;render();if(S.dtPo.filterOpen){var pinp=document.querySelector('input[data-action="pofilter"][data-col="'+pc2+'"]');if(pinp)pinp.focus();}return;}
  if(a==='potogglecolmenu'){S.colMenuOpenPo=!S.colMenuOpenPo;render();return;}
  if(a==='potogglecol'){var pc3=el.getAttribute('data-col');if(S.dtPo.hidden.has(pc3))S.dtPo.hidden.delete(pc3);else S.dtPo.hidden.add(pc3);render();S.colMenuOpenPo=true;return;}
  if(a==='popagefirst'){S.dtPo.page=1;render();return;}
  if(a==='popageprev'){S.dtPo.page=Math.max(1,S.dtPo.page-1);render();return;}
  if(a==='popagenext'){S.dtPo.page++;render();return;}
  if(a==='popagelast'){S.dtPo.page=999999;render();return;}
});

// Close col menu and DD on outside click
document.addEventListener('click',function(e){
  if(!e.target.closest('.dt-colmenu-wrap')&&S.colMenuOpen){S.colMenuOpen=false;render();}
  if(!e.target.closest('.dt-colmenu-wrap')&&S.colMenuOpenPo){S.colMenuOpenPo=false;render();}
  // Close dropdown lists on outside click
  if(ddOpenType&&!e.target.closest('.typeable-dd')){
    hideDDList('vendor');hideDDList('po');
  }
});


// Column resize
var eResizeCtx=null;
document.addEventListener('mousedown',function(e){
  var erEl=e.target.closest('.eresize');
  if(erEl){var th=erEl.closest('th');var col=erEl.getAttribute('data-ecol');eResizeCtx={col:col,th:th,startX:e.clientX,startW:th.getBoundingClientRect().width};e.preventDefault();return;}
  var poRe=e.target.closest('[data-action="poresize"]');
  if(poRe){var c=poRe.getAttribute('data-col');var th2=poRe.closest('th');poRe.classList.add('active');resizeCtx={c:c,el:poRe,startX:e.clientX,startW:th2.getBoundingClientRect().width,isPo:true};e.preventDefault();return;}
  var el=e.target.closest('[data-action="resize"]');if(!el)return;
  var c2=el.getAttribute('data-col');var th3=el.closest('th');
  el.classList.add('active');
  resizeCtx={c:c2,el:el,startX:e.clientX,startW:th3.getBoundingClientRect().width};
  e.preventDefault();
});
document.addEventListener('mousemove',function(e){
  if(eResizeCtx){var nw=Math.max(30,Math.round(eResizeCtx.startW+(e.clientX-eResizeCtx.startX)));eResizeCtx.th.style.width=nw+'px';eResizeCtx.th.style.minWidth=nw+'px';eResizeCtx.th.style.maxWidth=nw+'px';return;}
  if(!resizeCtx)return;
  var nw=Math.max(60,Math.round(resizeCtx.startW+(e.clientX-resizeCtx.startX)));
  var th=document.querySelector('table.dt th[data-col="'+resizeCtx.c+'"]');
  if(th){th.style.width=nw+'px';th.style.minWidth=nw+'px';th.style.maxWidth=nw+'px';}
});
document.addEventListener('mouseup',function(e){
  if(eResizeCtx){var nw=Math.max(30,Math.round(eResizeCtx.startW+(e.clientX-eResizeCtx.startX)));S.entryWidths[eResizeCtx.col]=nw;saveColWidthsToServer('matRecEntry',S.entryWidths);eResizeCtx=null;return;}
  if(!resizeCtx)return;
  var finalW=Math.max(60,Math.round(resizeCtx.startW+(e.clientX-resizeCtx.startX)));
  if(resizeCtx.isPo){S.dtPo.widths[resizeCtx.c]=finalW;saveColWidthsToServer('poRecView',S.dtPo.widths);}
  else{S.dt.widths[resizeCtx.c]=finalW;saveColWidthsToServer('matRecView',S.dt.widths);}
  resizeCtx.el.classList.remove('active');resizeCtx=null;render();
});

// Dropzone drag & drop support
document.addEventListener('dragover',function(e){
  var dz=e.target.closest('.dropzone');if(!dz)return;
  e.preventDefault();dz.classList.add('dragover');
});
document.addEventListener('dragleave',function(e){
  var dz=e.target.closest('.dropzone');if(!dz)return;
  dz.classList.remove('dragover');
});
document.addEventListener('drop',function(e){
  var dz=e.target.closest('.dropzone');if(!dz)return;
  e.preventDefault();dz.classList.remove('dragover');
  var field=dz.getAttribute('data-dropzone');
  if(!field||!S.matRecEntry)return;
  var files=e.dataTransfer.files;
  if(files.length>0){
    if(!Array.isArray(S.matRecEntry.topFields[field]))S.matRecEntry.topFields[field]=[];
    var pending=files.length;
    showToast('Uploading '+pending+' file(s) to Drive...',false);
    for(var fi=0;fi<files.length;fi++){
      (function(f){
        uploadFileToDrive(f,function(err,result){
          pending--;
          if(!err&&result){S.matRecEntry.topFields[field].push(result);}
          else{S.matRecEntry.topFields[field].push({name:f.name,url:'',error:err||'failed'});}
          if(pending<=0){render();showToast('Upload complete',false);}
        });
      })(files[fi]);
    }
  }
});
document.addEventListener('click',function(e){
  var dz=e.target.closest('.dropzone');
  if(!dz||!S.matRecEntry)return;
  if(e.target.closest('.click-link'))return;
  var field=dz.getAttribute('data-dropzone');if(!field)return;
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*,.pdf,.doc,.docx';inp.multiple=true;
  inp.onchange=function(){
    if(inp.files.length){
      if(!Array.isArray(S.matRecEntry.topFields[field]))S.matRecEntry.topFields[field]=[];
      var pending=inp.files.length;
      showToast('Uploading '+pending+' file(s) to Drive...',false);
      for(var fi=0;fi<inp.files.length;fi++){
        (function(f){
          uploadFileToDrive(f,function(err,result){
            pending--;
            if(!err&&result){
              S.matRecEntry.topFields[field].push(result);
            } else {
              S.matRecEntry.topFields[field].push({name:f.name,url:'',error:err||'failed'});
            }
            if(pending<=0){render();showToast('Upload complete',false);}
          });
        })(inp.files[fi]);
      }
    }
  };
  inp.click();
});
</script>
</body>
